<div class="contenedor">
  <div class="tarjeta">
    <h2>Crear cuenta</h2>
    <p class="subtitulo">Reseñas de Restaurantes</p>

    <form (ngSubmit)="registrar()">
      <label for="nombre">Nombre</label>
      <input id="nombre" type="text" name="nombre" [(ngModel)]="nombre" />

      <label for="correo">Correo</label>
      <input id="correo" type="email" name="correo" [(ngModel)]="correo" placeholder="correo@ejemplo.com" />

      <label for="password">Contraseña</label>
      <input id="password" type="password" name="password" [(ngModel)]="password" />

      @if (error) {
        <p class="error">{{ error }}</p>
      }
      @if (exito) {
        <p class="exito">{{ exito }}</p>
      }

      <button type="submit" class="btn">Registrarse</button>
    </form>

    <p class="enlace">¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
  </div>
</div>
