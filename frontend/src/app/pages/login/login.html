<div class="contenedor">
  <div class="tarjeta">
    <h2>Iniciar sesión</h2>
    <p class="subtitulo">Reseñas de Restaurantes</p>

    <form (ngSubmit)="iniciarSesion()">
      <label for="correo">Correo</label>
      <input id="correo" type="email" name="correo" [(ngModel)]="correo" placeholder="correo@ejemplo.com" />

      <label for="password">Contraseña</label>
      <input id="password" type="password" name="password" [(ngModel)]="password" />

      @if (error) {
        <p class="error">{{ error }}</p>
      }

      <button type="submit" class="btn" [disabled]="cargando">
        {{ cargando ? 'Ingresando...' : 'Ingresar' }}
      </button>
    </form>

    <p class="enlace">¿No tienes cuenta? <a routerLink="/registro">Regístrate</a></p>
  </div>
</div>
